name: aito start across platforms

# `pip install .` -> `aito start` -> aito.Client() query -> `aito keys --rotate` -> `aito stop`,
# on the container runtimes a newcomer has (td-20260930083456875743, ADR 0001). Runs on
# GitHub's runners, pinned to the image this SDK version pins (aito/local/server.py).
# Where Aito cannot run (Windows containers, no Docker) the job checks that `aito start`
# refuses with a message that names the fix, not a traceback.

on:
  push:
    paths:
      - 'aito/local/**'
      - 'aito/cli/__init__.py'
      - 'aito/v2/client.py'
      - 'scripts/ci/local_server_smoke.py'
      - '.github/workflows/local-server.yml'
      - 'scripts/pin-engine.py'
  workflow_dispatch:
    inputs:
      image:
        description: 'A candidate engine image to test instead of the pin, e.g. ghcr.io/aitohq/aito:v2.11.2'
        required: false
        default: 

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: ${{ matrix.exploratory || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64 docker
            os: ubuntu-latest
            engine: docker
          - name: linux-x64 podman-as-docker
            os: ubuntu-latest
            engine: podman
          - name: linux-arm64 docker (amd64 image, emulated)
            os: ubuntu-24.04-arm
            engine: docker-binfmt
          # Native arm64: runs the whole path when the image is multi-arch, otherwise
          # must refuse cleanly (exec format error, no emulation on this runner)
          - name: linux-arm64 docker (no emulation)
            os: ubuntu-24.04-arm
            engine: docker-nobinfmt
            refusal_unless_multiarch: CPU architecture
          - name: macos-arm64 without docker
            os: macos-latest
            engine: none
            refusal: Docker is not installed
          - name: macos-intel colima
            os: macos-15-intel
            engine: colima
            exploratory: true
          - name: windows (windows containers)
            os: windows-latest
            engine: docker
            refusal: Linux containers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: podman stands in for docker
        if: matrix.engine == 'podman'
        run: |
          mkdir -p "$HOME/shim"
          printf '#!/bin/sh\nexec podman "$@"\n' > "$HOME/shim/docker"
          chmod +x "$HOME/shim/docker"
          echo "$HOME/shim" >> "$GITHUB_PATH"
          podman --version
      - name: amd64 emulation (what Docker Desktop provides on Apple Silicon)
        if: matrix.engine == 'docker-binfmt'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - name: no amd64 emulation (GitHub's arm64 runners have none; shown for the record)
        if: matrix.engine == 'docker-nobinfmt'
        run: docker run --privileged --rm tonistiigi/binfmt
      - name: colima
        if: matrix.engine == 'colima'
        run: |
          brew install colima docker
          colima start --cpu 2 --memory 4
          docker info --format '{{.ServerVersion}} {{.OSType}}/{{.Architecture}}'
      - name: no docker on PATH
        if: matrix.engine == 'none'
        run: if command -v docker; then echo "docker unexpectedly present"; exit 1; fi

      - name: Runtime in use
        if: matrix.engine != 'none'
        shell: bash
        run: docker version --format 'client {{.Client.Version}} server {{.Server.Version}} {{.Server.Os}}/{{.Server.Arch}}' || docker version

      - name: pip install .   (no [cli] extra, as a newcomer installs it)
        run: python -m pip install .

      - name: Expectation for this runner and image
        id: expect
        shell: bash
        env:
          STATIC: ${{ matrix.refusal }}
          UNLESS_MULTIARCH: ${{ matrix.refusal_unless_multiarch }}
          IMAGE: ${{ inputs.image }}
        run: |
          refusal="$STATIC"
          if [ -n "$UNLESS_MULTIARCH" ]; then
            if python scripts/pin-engine.py --check-multiarch ${IMAGE:+"$IMAGE"}; then refusal=""
            else refusal="$UNLESS_MULTIARCH"; fi
          fi
          echo "refusal=$refusal" >> "$GITHUB_OUTPUT"
          echo "image: ${IMAGE:-the pinned one}; expect: ${refusal:-the full path}"
      - name: aito start -> Client() -> keys --rotate -> stop
        if: ${{ !steps.expect.outputs.refusal }}
        env:
          AITO_SMOKE_IMAGE: ${{ inputs.image }}
        run: python scripts/ci/local_server_smoke.py
      - name: aito start refuses cleanly
        if: ${{ steps.expect.outputs.refusal }}
        env:
          REFUSAL: ${{ steps.expect.outputs.refusal }}
          AITO_SMOKE_IMAGE: ${{ inputs.image }}
        shell: bash
        run: python scripts/ci/local_server_smoke.py --expect-refusal "$REFUSAL"
